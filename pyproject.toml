[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prompt-shield-bench"
version = "0.1.0"
description = "Benchmark for prompt-injection defences: measure how many attacks a guardrail or hardened prompt stops, how often it blocks legitimate input, and how much latency it adds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Osama Wehbi" }]
keywords = ["prompt-injection", "benchmark", "llm-security", "ai-security", "guardrails", "jailbreak", "evaluation", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.2",
    "rich>=13.7",
    "typer>=0.29.2",
]

[project.optional-dependencies]
hf = ["transformers>=4.50", "torch>=2.6"]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "bandit>=1.9.4",
    "pip-audit>=2.9",
    "pre-commit>=4.7.0",
]

[project.scripts]
prompt-shield-bench = "prompt_shield_bench.cli:main"
psb = "prompt_shield_bench.cli:main"

[project.urls]
Homepage = "https://github.com/OsamaWehbi/prompt-shield-bench"
Issues = "https://github.com/OsamaWehbi/prompt-shield-bench/issues"
Changelog = "https://github.com/OsamaWehbi/prompt-shield-bench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_shield_bench"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "S101", "RUF001", "RUF002", "RUF003", "RUF012", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S310", "S311", "S603"]
"examples/*" = ["S310"]
"src/prompt_shield_bench/cli.py" = ["B008"]
"src/prompt_shield_bench/detectors.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
