name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (including the check that published results match the dataset)
        run: pytest
      - name: Baselines reproduce the published leaderboard
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          mkdir -p /tmp/psb
          psb detect heuristic -o /tmp/psb/heuristic.json --name "heuristic (built-in baseline)" > /dev/null
          psb detect keywords -o /tmp/psb/keywords.json --name "keywords (built-in baseline)" > /dev/null
          psb leaderboard /tmp/psb/heuristic.json /tmp/psb/keywords.json -o /tmp/psb/LEADERBOARD.md
          # Latency differs between machines; compare everything else.
          diff <(sed -E 's/\| [0-9.<]+ ms \|/| x |/' LEADERBOARD.md) <(sed -E 's/\| [0-9.<]+ ms \|/| x |/' /tmp/psb/LEADERBOARD.md)

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install . bandit pip-audit
      - name: Bandit (SAST)
        run: bandit -q -r src -c pyproject.toml
      - name: pip-audit (dependency CVEs)
        run: pip-audit --progress-spinner off --skip-editable
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
